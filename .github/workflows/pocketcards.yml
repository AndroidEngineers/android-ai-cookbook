name: PocketCards checks
on:
  push:
    paths: ['ai-fundamentals/**', '.github/workflows/pocketcards.yml']
  pull_request:
    paths: ['ai-fundamentals/**', '.github/workflows/pocketcards.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-fundamentals
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, unit tests, lint, and compile device tests
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
